<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Display - Property</title>
    <style>
        .block{
            display: block;
            background-color: rgb(245, 206, 156);
            padding:10px;
            margin:10px;
        }
        .inline{
            background-color: beige;
            display:inline;
            padding:10px;
            margin:10px;
            
        }
        .inlineblock{
            display:inline-block;
            background-color: rgb(250, 250, 131);
            padding:10px;
            margin:10px;
            width:100px;
            
        }
    </style>
</head>
<body style="background-color: aquamarine;">

    <h2>Display:Block</h2>
    <div class="block">Box1 (Block)</div>
    <div class="block">Box2 (Block)</div>

    <h2>Display:Inline</h2>
    <div class="inline">word1</div>
    <div class="inline">word1</div>
    <div class="inline">word1</div>

    
    <h2>Display:Inline - Block</h2>
    <div class="inlineblock">Box A</div>
    <div class="inlineblock">Box B</div>
    <div class="inlineblock">Box C</div>
  
   
   </div>

    
</body>
</html>
